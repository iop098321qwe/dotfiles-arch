# Espanso Match File

# Dispatch Email Template Matches
anchors:
  greeting: &greeting
    name: greeting
    type: match
    params:
      trigger: ";greet"

  addongreeting: &addongreeting
    name: addongreeting
    type: match
    params:
      trigger: ";addongreet"

  setappointment: &setappointment
    name: setappointment
    type: match
    params:
      trigger: ";setappointment"

  deadlines: &deadlines
    name: deadlines
    type: match
    params:
      trigger: ";deadlines"

  outreachthanks: &outreachthanks
    name: outreachthanks
    type: match
    params:
      trigger: ";outreachthanks"

  assigned: &assigned
    name: assigned
    type: match
    params:
      trigger: ";assigned"

  signature: &signature
    name: signature
    type: match
    params:
      trigger: ";signature"

matches:
  - regex: ";resreqapp(?P<person>.*)\\."
    label: Request with Appointment Email Response Template
    comment: "This is an email response template for a request with an appointment."
    vars:
      - *greeting
      - *addongreeting
      - *setappointment
      - *deadlines
      - *signature
      - *assigned
      - *outreachthanks
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}
      $|$
      {{assigned}}

      {{setappointment}}

      {{deadlines}}

      {{signature}}

  # Set up replacement for first response request without appointment
  - regex: ";resreqnoapp(?P<person>.*)\\."
    label: Request without Appointment Email Response Template
    comment: "This is an email response template for a request without an appointment."
    vars:
      - *greeting
      - *addongreeting
      - *deadlines
      - *signature
      - *assigned
      - *outreachthanks
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}
      $|$
      {{assigned}}

      {{deadlines}}

      {{signature}}

  # Set up replacement for first response incident
  - regex: ";resinc(?P<person>.*)\\."
    label: Incident Email Response Template
    comment: "This is an email response template for an incident."
    vars:
      - *greeting
      - *addongreeting
      - *setappointment
      - *signature
      - *assigned
      - *outreachthanks
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}
      $|$
      {{assigned}}

      {{setappointment}}

      {{signature}}

  # Set up replacement for first response spam
  - regex: ";resspam(?P<person>.*)\\."
    label: Spam Email Response Template
    comment: "This is an email response template for spam."
    vars:
      - *greeting
      - *addongreeting
      - *signature
      - *assigned
      - *outreachthanks
    replace: |-
      {{greeting}}{{person}},{{addongreeting}}

      {{outreachthanks}}

      {{assigned}}

      They will notify you if this is indeed spam and block the sender. If it is safe, they will reach out to confirm it is all right to access the email and its contents. Please let me know if you have any questions or concerns, and I will do my best to address them!

      {{signature}}
