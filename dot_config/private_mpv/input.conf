# Mirror mpv's arrow keys and their modifiers
h seek -5
l seek 5
H no-osd seek -1 exact
L no-osd seek 1 exact
Ctrl+h no-osd sub-seek -1
Ctrl+l no-osd sub-seek 1
Ctrl+Shift+h sub-step -1
Ctrl+Shift+l sub-step 1
Alt+h add video-pan-x 0.1
Alt+l add video-pan-x -0.1
j seek 60
k seek -60

# Playlist navigation
J playlist-next
K playlist-prev

# Subtitle and loop controls moved from j/J and l/L
c cycle sub
C cycle sub down
a ab-loop
n cycle-values loop-file "inf" "no"

# Video rotation
Alt+j cycle-values video-rotate 0 270 180 90
Alt+k cycle-values video-rotate 0 90 180 270

# Hardware decoding toggle moved from Ctrl+h
Ctrl+Alt+h cycle-values hwdec "no" "auto"
