# Vim-style navigation
h seek -5
j playlist-next
k playlist-prev
l seek 5
J seek 60
L seek -60

# Subtitle and loop controls moved from j/J and l/L
c cycle sub
C cycle sub down
a ab-loop
n cycle-values loop-file "inf" "no"

# Video rotation
Alt+h cycle-values video-rotate 0 270 180 90
Alt+l cycle-values video-rotate 0 90 180 270
