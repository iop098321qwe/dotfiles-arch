# ~/.config/starship.toml
# Config file for starship for iop098321qwe

# Disable newlines
add_newline = false

# Set custom prompt
format = '''
[┌─────────────────────────────────────────────────────>](bold green)
[│](bold green)$os$username$hostname$directory$rust$package$git_branch$git_status$cmd_duration
[└>](bold green)$character '''

# Customize the username module
[username]
disabled = true
show_always = true
style_user = "bold yellow"

# Customize the hostname module
[hostname]
disabled = false
style = "bold cyan"

# Customize the os module
[os]
disabled = true
style = "bold white"

# Customize the character module
[character]
disabled = false
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
vimcmd_replace_one_symbol = "[❮](bold bright-purple)"
vimcmd_replace_symbol = "[❮](bold bright-purple)"
vimcmd_visual_symbol = "[❮](bold yellow)"

# Customize the directory module
[directory]
disabled = false
truncation_length = 5
truncation_symbol = '.../'
style = "bold blue"

# Customize the git_branch module
[git_branch]
disabled = false
symbol = " "          # Optional: Git branch symbol
style = "bold purple"

# Customize the git_status module
[git_status]
disabled = false
conflicted = "✖"                              # Conflicted file
ahead = "⇡${count}"                           # Ahead of upstream
behind = "⇣${count}"                          # Behind upstream
diverged = "⇕⇡${ahead_count}⇣${behind_count}" # Diverged
untracked = "?"                               # Untracked files
stashed = "!"                                 # Stashed changes
modified = "✚"                                # Modified files
staged = "●"                                  # Staged files
renamed = "➜"                                 # Renamed files
deleted = "–"                                 # Deleted files
style = "bold red"

# Customize the rust module
[rust]
symbol = "🦀 "
style = "bold red"
disabled = false

# Customize the package module
[package]
disabled = false

# Customize the command duration module
[cmd_duration]
min_time = 1
style = 'bold blue'
format = 'took [$duration]($style)'
disabled = false
